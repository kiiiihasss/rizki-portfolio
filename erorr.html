  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#111827,#1e3a8a);color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;padding:20px;overflow:hidden}
    .container{max-width:650px;background:rgba(255,255,255,0.06);padding:50px;border-radius:25px;box-shadow:0 8px 35px rgba(0,0,0,0.5);backdrop-filter:blur(12px);animation:fadeIn 1.2s ease;position:relative}
    h1{font-size:2.7rem;margin-bottom:15px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    p{color:#d1d5db;margin-bottom:35px;line-height:1.6;font-size:1.05rem}
    .btn{display:inline-block;padding:12px 26px;margin:8px;font-size:1rem;font-weight:600;border-radius:12px;text-decoration:none;transition:0.3s ease-in-out}
    .btn.primary{background:linear-gradient(90deg,#3b82f6,#9333ea);color:#fff;box-shadow:0 4px 20px rgba(59,130,246,0.4)}
    .btn.primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(59,130,246,0.5)}
    .btn.secondary{border:2px solid #60a5fa;color:#60a5fa}
    .btn.secondary:hover{background:#60a5fa;color:#fff;transform:translateY(-2px)}
    .icon{width:110px;margin-bottom:25px;animation:float 3.5s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3))}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .background-decor{position:absolute;top:-100px;left:-100px;width:300px;height:300px;background:radial-gradient(circle at center,rgba(59,130,246,0.4),transparent 70%);filter:blur(80px);z-index:-1}
    .background-decor2{position:absolute;bottom:-100px;right:-100px;width:300px;height:300px;background:radial-gradient(circle at center,rgba(147,51,234,0.4),transparent 70%);filter:blur(80px);z-index:-1}
  </style>
</head>
<body>
  <div class="container">
